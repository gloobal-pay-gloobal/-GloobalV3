<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gloobal Access</title>
    <meta
      name="description"
      content="Cashless. Taxless. Borderless. Limitless. Register with a Secure ID, send money worldwide, link banks, and track global coverage."
    />

    <!-- Android auto-links anything it reads as a phone number, date or
         address. This app renders a lot of phone-number-shaped text, and
         auto-linking makes it look like a web page instead of an app. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- PWA. The manifest itself is generated by vite-plugin-pwa (see
         vite.config.js) and injected here at build time. -->
    <meta name="theme-color" content="#7C3AED" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gloobal ID" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The design's display typeface (screen titles, balances, headings —
         T.fontDisplay in frontend/constants/theme.js) is Space Grotesk.
         Only the weights actually used are requested; the CSS
         font-family list falls back to the system stack if this fails. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Inlined so the very first paint — before the stylesheet and the JS
         bundle arrive — already matches the app background instead of
         flashing white. */
      html, body { margin: 0; height: 100%; background: #F6F5FC; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
